name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Set API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$TG_API_ID" ]; then
            sed -i -E "s/(APP_ID = )[0-9]+;/\1${TG_API_ID};/" "$F"
          fi
          if [ -n "$TG_API_HASH" ]; then
            sed -i -E "s/(APP_HASH = )\"[^\"]*\";/\1\"${TG_API_HASH}\";/" "$F"
          fi

      - name: Change package name to org.auragram.app
        run: |
          python3 - <<'EOF'
          import pathlib, re

          NEW = "org.auragram.app"
          skip_dirs = {".git", "build", ".cxx", ".gradle"}
          quoted = re.compile(r'(["\'])org\.telegram\.messenger(\.web|\.beta)?\1')
          prop = re.compile(r'(=\s*)org\.telegram\.messenger(\.web|\.beta)?\s*$')
          perm = re.compile(r'org\.telegram\.messenger(\.web|\.beta)?\.(permission|provider)')

          for f in pathlib.Path('.').rglob('*'):
              if not f.is_file() or skip_dirs & set(f.parts):
                  continue

              if f.suffix in ('.gradle', '.kts', '.kt', '.properties'):
                  text = f.read_text(encoding='utf-8', errors='ignore')
                  out = []
                  for ln in text.split('\n'):
                      if 'namespace' in ln or ln.lstrip().startswith(('package ', 'import ')):
                          out.append(ln)
                          continue
                      ln = quoted.sub(lambda m: m.group(1) + NEW + m.group(1), ln)
                      if f.suffix == '.properties':
                          ln = prop.sub(lambda m: m.group(1) + NEW, ln)
                      out.append(ln)
                  new = '\n'.join(out)
                  if new != text:
                      f.write_text(new, encoding='utf-8')
                      print('package changed in', f)

              elif f.name == 'AndroidManifest.xml':
                  text = f.read_text(encoding='utf-8', errors='ignore')
                  new = perm.sub(lambda m: NEW + '.' + m.group(2), text)
                  if new != text:
                      f.write_text(new, encoding='utf-8')
                      print('manifest permission/provider changed in', f)
          EOF
          find . -name google-services.json -not -path "./.git/*" -exec sed -i 's/org\.telegram\.messenger/org.auragram.app/g' {} +
          grep -rn "applicationId" --include=*.gradle --include=*.kts --include=*.kt . | grep -v "/build/" || true

      - name: Disable Firebase google-services plugin
        run: |
          python3 - <<'EOF'
          import pathlib, re
          for f in pathlib.Path('.').glob('TMessagesProj_App*/build.gradle'):
              t = f.read_text(encoding='utf-8', errors='ignore')
              n = re.sub(r'(?m)^(\s*)((apply plugin:|id)\s*\(?\s*["\']com\.google\.gms\.google-services["\'].*)$', r'\1// \2', t)
              if n != t:
                  f.write_text(n, encoding='utf-8')
                  print('disabled google-services in', f)
          EOF

      - name: Rename app to AuraGram everywhere
        run: |
          python3 - <<'EOF'
          import pathlib, re

          roots = ["TMessagesProj", "TMessagesProj_App", "TMessagesProj_AppHuawei",
                   "TMessagesProj_AppStandalone", "TMessagesProj_AppHockeyApp"]
          word = re.compile(r'\bTelegram\b')
          literal = re.compile(r'"(?:[^"\\\n]|\\.)*"')
          changed = 0

          for root in roots:
              base = pathlib.Path(root)
              if not base.exists():
                  continue
              for f in base.rglob("*"):
                  if not f.is_file():
                      continue
                  path = f.as_posix()
                  if f.suffix == ".xml" and "/res/" in path:
                      text = f.read_bytes().decode("utf-8", "ignore")
                      out = []
                      for ln in text.split("\n"):
                          low = ln.lower()
                          if "http" in low or "xmlns" in low or "telegram.org" in low:
                              out.append(ln)
                          else:
                              out.append(word.sub("AuraGram", ln))
                      new = "\n".join(out)
                  elif f.suffix == ".java":
                      text = f.read_bytes().decode("utf-8", "ignore")
                      new = literal.sub(
                          lambda m: m.group(0) if "http" in m.group(0)
                          else word.sub("AuraGram", m.group(0)),
                          text)
                  else:
                      continue
                  if new != text:
                      f.write_bytes(new.encode("utf-8"))
                      changed += 1

          print(f"Renamed Telegram -> AuraGram in {changed} files")
          EOF

      - name: Install ImageMagick
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick

      - name: Replace app logo
        run: |
          if [ ! -f auragram_logo.png ]; then
            echo "auragram_logo.png nahi mila, logo step skip"
            exit 0
          fi
          RES=TMessagesProj/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26" "$RES/mipmap-anydpi"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}
            size=${d##*:}
            out="$RES/mipmap-${name}"
            mkdir -p "$out"
            convert auragram_logo.png -resize "${size}x${size}" "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon --stacktrace

      - name: Verify package name
        run: |
          APK=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -n 1)
          echo "APK: $APK"
          echo "--- package ---"
          $AAPT dump badging "$APK" | grep "^package:" || true
          echo "--- declared permissions ---"
          $AAPT dump permissions "$APK" | grep -i "permission:" || true
          echo "--- provider authorities ---"
          $AAPT dump xmltree "$APK" AndroidManifest.xml | grep -i "authorities" || true
          if $AAPT dump badging "$APK" | grep "^package:" | grep -q "name='org.telegram.messenger"; then
            echo "ERROR: package abhi bhi org.telegram.messenger hai"
            exit 1
          fi
          if $AAPT dump xmltree "$APK" AndroidManifest.xml | grep -i "authorities" | grep -q "org.telegram.messenger"; then
            echo "ERROR: provider authority abhi bhi org.telegram.messenger hai"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraGram-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
