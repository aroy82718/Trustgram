name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Set API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$TG_API_ID" ]; then
            sed -i -E "s/(APP_ID = )[0-9]+;/\1${TG_API_ID};/" "$F"
          fi
          if [ -n "$TG_API_HASH" ]; then
            sed -i -E "s/(APP_HASH = )\"[^\"]*\";/\1\"${TG_API_HASH}\";/" "$F"
          fi

      - name: Change package name to org.auragram.app
        run: |
          python3 - <<'EOF'
          import pathlib, re

          NEW = "org.auragram.app"
          skip_dirs = {".git", "build", ".cxx", ".gradle"}
          quoted = re.compile(r'(["\'])org\.telegram\.messenger(\.web|\.beta)?\1')
          prop = re.compile(r'(=\s*)org\.telegram\.messenger(\.web|\.beta)?\s*$')
          perm = re.compile(r'org\.telegram\.messenger(\.web|\.beta)?\.(permission|provider)')

          for f in pathlib.Path('.').rglob('*'):
              if not f.is_file() or skip_dirs & set(f.parts):
                  continue
              if f.suffix in ('.gradle', '.kts', '.kt', '.properties'):
                  text = f.read_text(encoding='utf-8', errors='ignore')
                  out = []
                  for ln in text.split('\n'):
                      if 'namespace' in ln or ln.lstrip().startswith(('package ', 'import ')):
                          out.append(ln)
                          continue
                      ln = quoted.sub(lambda m: m.group(1) + NEW + m.group(1), ln)
                      if f.suffix == '.properties':
                          ln = prop.sub(lambda m: m.group(1) + NEW, ln)
                      out.append(ln)
                  new = '\n'.join(out)
                  if new != text:
                      f.write_text(new, encoding='utf-8')
                      print('package changed in', f)
              elif f.name == 'AndroidManifest.xml':
                  text = f.read_text(encoding='utf-8', errors='ignore')
                  new = perm.sub(lambda m: NEW + '.' + m.group(2), text)
                  if new != text:
                      f.write_text(new, encoding='utf-8')
                      print('manifest permission/provider changed in', f)
          EOF
          find . -name google-services.json -not -path "./.git/*" -exec sed -i 's/org\.telegram\.messenger/org.auragram.app/g' {} +
          grep -rn "applicationId" --include=*.gradle --include=*.kts --include=*.kt . | grep -v "/build/" || true

      - name: Disable Firebase google-services plugin
        run: |
          python3 - <<'EOF'
          import pathlib, re
          for f in pathlib.Path('.').glob('TMessagesProj_App*/build.gradle'):
              t = f.read_text(encoding='utf-8', errors='ignore')
              n = re.sub(r'(?m)^(\s*)((apply plugin:|id)\s*\(?\s*["\']com\.google\.gms\.google-services["\'].*)$', r'\1// \2', t)
              if n != t:
                  f.write_text(n, encoding='utf-8')
                  print('disabled google-services in', f)
          EOF

      - name: Rename app to AuraGram everywhere
        run: |
          python3 - <<'EOF'
          import pathlib, re

          roots = ["TMessagesProj", "TMessagesProj_App", "TMessagesProj_AppHuawei",
                   "TMessagesProj_AppStandalone", "TMessagesProj_AppHockeyApp"]
          word = re.compile(r'\bTelegram\b')
          literal = re.compile(r'"(?:[^"\\\n]|\\.)*"')
          changed = 0

          for root in roots:
              base = pathlib.Path(root)
              if not base.exists():
                  continue
              for f in base.rglob("*"):
                  if not f.is_file():
                      continue
                  path = f.as_posix()
                  if f.suffix == ".xml" and "/res/" in path:
                      text = f.read_bytes().decode("utf-8", "ignore")
                      out = []
                      for ln in text.split("\n"):
                          low = ln.lower()
                          if "http" in low or "xmlns" in low or "telegram.org" in low:
                              out.append(ln)
                          else:
                              out.append(word.sub("AuraGram", ln))
                      new = "\n".join(out)
                  elif f.suffix == ".java":
                      text = f.read_bytes().decode("utf-8", "ignore")
                      new = literal.sub(
                          lambda m: m.group(0) if "http" in m.group(0)
                          else word.sub("AuraGram", m.group(0)),
                          text)
                  else:
                      continue
                  if new != text:
                      f.write_bytes(new.encode("utf-8"))
                      changed += 1

          print(f"Renamed Telegram -> AuraGram in {changed} files")
          EOF
          find TMessagesProj -path '*/res/values*' -name '*.xml' -exec sed -i -E 's#(<string name="Page1Title"[^>]*>)[^<]*(</string>)#\1AuraGram\2#' {} +

      - name: Brand everywhere (runtime name + skip intro)
        run: |
          python3 - <<'EOF'
          import pathlib, re

          def match_brace(s, open_idx):
              depth = 0
              for i in range(open_idx, len(s)):
                  if s[i] == '{':
                      depth += 1
                  elif s[i] == '}':
                      depth -= 1
                      if depth == 0:
                          return i
              return -1

          lc = pathlib.Path('TMessagesProj/src/main/java/org/telegram/messenger/LocaleController.java')
          src = lc.read_text(encoding='utf-8', errors='ignore')
          patched = 0
          if 'fixBrand(' not in src:
              for m in list(re.finditer(r'String\s+getStringInternal\s*\([^)]*\)\s*\{', src))[::-1]:
                  start = m.end() - 1
                  end = match_brace(src, start)
                  if end < 0:
                      continue
                  body = src[start:end + 1]
                  nb = re.sub(r'return\s+value\s*;', 'return fixBrand(value);', body)
                  if nb != body:
                      src = src[:start] + nb + src[end + 1:]
                      patched += 1
              for m in list(re.finditer(r'String\s+formatString\s*\([^)]*\)\s*\{', src))[::-1]:
                  start = m.end() - 1
                  end = match_brace(src, start)
                  if end < 0:
                      continue
                  body = src[start:end + 1]
                  nb = re.sub(r',\s*value\s*,\s*args', ', fixBrand(value), args', body)
                  nb = re.sub(r'\(\s*value\s*,\s*args', '(fixBrand(value), args', nb)
                  if nb != body:
                      src = src[:start] + nb + src[end + 1:]
                      patched += 1
              helper = '''
              public static String fixBrand(String s) {
                  if (s == null || s.indexOf("Telegram") < 0) return s;
                  String l = s.toLowerCase();
                  if (l.contains("telegram.org") || l.contains("t.me/") || l.contains("://")) return s;
                  return s.replace("Telegram", "AuraGram");
              }
              '''
              idx = src.rfind('}')
              src = src[:idx] + helper + '\n' + src[idx:]
              lc.write_text(src, encoding='utf-8')
          print('LocaleController patched methods:', patched)
          print('PATCH OK (name)' if patched else 'PATCH FAILED (name) - LocaleController.java ka structure alag hai')

          la = pathlib.Path('TMessagesProj/src/main/java/org/telegram/ui/LaunchActivity.java')
          t = la.read_text(encoding='utf-8', errors='ignore')
          m = re.search(r'getClientNotActivatedFragment\s*\(\s*\)\s*\{', t)
          done = False
          if m:
              start = m.end() - 1
              end = match_brace(t, start)
              body = t[start:end + 1]
              nb = re.sub(r'return\s+new\s+IntroActivity\s*\(\s*\)\s*;', 'return new LoginActivity();', body)
              if nb != body:
                  t = t[:start] + nb + t[end + 1:]
                  la.write_text(t, encoding='utf-8')
                  done = True
          print('PATCH OK (intro skipped)' if done else 'PATCH FAILED (intro) - getClientNotActivatedFragment nahi mila')
          EOF

      - name: Install ImageMagick
        run: |
          sudo apt-get update -y
          sudo apt-get install -y imagemagick webp

      - name: Replace logo everywhere
        run: |
          if [ ! -f auragram_logo.png ]; then
            echo "auragram_logo.png nahi mila, logo step skip"
            exit 0
          fi
          python3 - <<'EOF'
          import pathlib, re, subprocess

          LOGO = "auragram_logo.png"
          res_dirs = [p for p in pathlib.Path('.').glob('TMessagesProj*/src/*/res') if p.is_dir()]

          # Adaptive icon XML hatao taaki PNG icon dikhe
          for rd in res_dirs:
              for d in ("mipmap-anydpi-v26", "mipmap-anydpi"):
                  p = rd / d
                  if p.exists():
                      subprocess.run(["rm", "-rf", str(p)])

          logo_re = re.compile(
              r'^(ic_launcher.*|intro_tg_sphere.*|.*telegram.*logo.*|.*logo.*telegram.*|'
              r'telegram_logo.*|ic_telegram.*|telegram_icon.*|telegram_splash.*|splash_telegram.*|'
              r'ic_logo.*|app_icon.*|logo|logo_.*|ic_tg_logo.*|tg_logo.*|login_logo.*|about_logo.*)$')
          plane_re = re.compile(r'^intro_tg_plane.*$')
          exclude_re = re.compile(
              r'.*(notification|notify|ic_stat|google|premium|star|fragment|ton|wallet|bank|'
              r'huawei|apple|facebook|twitter|vk|sticker|emoji|bot).*')

          replaced, vectors, others = [], [], []
          for rd in res_dirs:
              for f in sorted(rd.rglob('*')):
                  if not f.is_file():
                      continue
                  stem = f.stem.lower()
                  ext = f.suffix.lower()
                  if ext not in ('.png', '.webp', '.jpg', '.xml'):
                      continue
                  if exclude_re.match(stem):
                      continue
                  is_logo = logo_re.match(stem)
                  is_plane = plane_re.match(stem)

                  if ext == '.xml':
                      if not is_logo or stem.startswith('ic_launcher'):
                          if 'telegram' in stem:
                              others.append(str(f))
                          continue
                      head = f.read_text(encoding='utf-8', errors='ignore')[:400]
                      if '<vector' in head or '<layer-list' in head or '<bitmap' in head:
                          out = f.with_suffix('.png')
                          subprocess.run(["convert", LOGO, "-resize", "512x512", "-background", "none",
                                          "-gravity", "center", "-extent", "512x512", "PNG32:" + str(out)], check=True)
                          f.unlink()
                          vectors.append(str(f))
                      continue

                  if not (is_logo or is_plane):
                      if 'telegram' in stem or stem.startswith('tg_') or '_tg_' in stem:
                          others.append(str(f))
                      continue
                  size = subprocess.check_output(["identify", "-format", "%wx%h", str(f) + "[0]"]).decode().strip()
                  prefix = "PNG32:" if ext == '.png' else ""
                  if is_plane:
                      cmd = ["convert", "-size", size, "xc:none", prefix + str(f)]
                  else:
                      cmd = ["convert", LOGO, "-resize", size, "-background", "none",
                             "-gravity", "center", "-extent", size, prefix + str(f)]
                  subprocess.run(cmd, check=True)
                  replaced.append(f"{f} ({size})")

          print("--- replaced images ---")
          for r in replaced:
              print(r)
          print("--- replaced vector logos (xml -> png) ---")
          for v in vectors:
              print(v)
          print("--- still telegram-ish files (not replaced) ---")
          for o in others:
              print(o)
          print("TOTAL replaced:", len(replaced), "vectors:", len(vectors))
          EOF

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon --stacktrace

      - name: Verify package name
        run: |
          APK=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort | tail -n 1)
          echo "APK: $APK"
          $AAPT dump badging "$APK" | grep "^package:" || true
          $AAPT dump badging "$APK" | grep "application-label:" || true
          if $AAPT dump badging "$APK" | grep "^package:" | grep -q "name='org.telegram.messenger"; then
            echo "ERROR: package abhi bhi org.telegram.messenger hai"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AuraGram-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
