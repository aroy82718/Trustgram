name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          yes | "$SDKM" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Set API credentials
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
        run: |
          F=TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          if [ -n "$TG_API_ID" ]; then
            sed -i -E "s/(APP_ID = )[0-9]+;/\1${TG_API_ID};/" "$F"
          fi
          if [ -n "$TG_API_HASH" ]; then
            sed -i -E "s/(APP_HASH = )\"[^\"]*\";/\1\"${TG_API_HASH}\";/" "$F"
          fi

      - name: Rename app to Trust Gram
        run: |
          for dir in TMessagesProj TMessagesProj_App TMessagesProj_AppHuawei TMessagesProj_AppStandalone; do
            [ -d "$dir" ] || continue
            # Resource strings: sirf text content badlo, key names aur URLs nahi
            find "$dir" -path '*/res/*' -name "strings*.xml" -exec sed -i -E '/https?:\/\//!{:a;s/(>[^<]*)Telegram/\1Trust Gram/;ta}' {} +
            # Java code ke string literals: "Telegram" se shuru hone wale
            find "$dir" -name "*.java" -exec sed -i -E 's/"Telegram([ "])/"Trust Gram\1/g' {} +
          done

      - name: Replace app logo
        run: |
          if [ ! -f trustgram_logo.png ]; then
            echo "trustgram_logo.png nahi mila, logo step skip"
            exit 0
          fi
          RES=TMessagesProj/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26" "$RES/mipmap-anydpi"
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            name=${d%%:*}
            size=${d##*:}
            out="$RES/mipmap-${name}"
            mkdir -p "$out"
            convert trustgram_logo.png -resize "${size}x${size}" "$out/ic_launcher.png"
            cp "$out/ic_launcher.png" "$out/ic_launcher_round.png"
          done

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :TMessagesProj_App:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TrustGram-APK
          path: "**/build/outputs/apk/**/*.apk"
          if-no-files-found: error
